<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Shield — SME Cash Flow Predictor &amp; Financial Intelligence Platform</title>
    <meta name="description" content="Flow Shield is an SME Cash Flow Predictor that forecasts liquidity shortages up to 90 days in advance, simulates supply chain shocks, and provides actionable recommendations for financial planning." />
    <meta property="og:title" content="Flow Shield — SME Cash Flow Predictor &amp; Financial Intelligence Platform" />
    <meta property="og:description" content="Flow Shield is an SME Cash Flow Predictor that forecasts liquidity shortages up to 90 days in advance, simulates supply chain shocks, and provides actionable recommendations for financial planning." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cashshock_theme');
          var theme = saved || 'light';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.backgroundColor = '#000000';
            root.style.color = '#ededed';
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.backgroundColor = '#ffffff';
            root.style.color = '#171717';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.light, html.light body {
        background-color: #ffffff;
        color: #171717;
      }
      html.dark, html.dark body {
        background-color: #000000;
        color: #ededed;
      }
    </style>
  </head>
  <body class="font-sans antialiased m-0 p-0 overflow-x-hidden min-h-[100dvh]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
