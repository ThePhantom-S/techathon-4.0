version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowshield-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=cashshock_user
      - DB_PASSWORD=cashshock_password
      - DB_NAME=cashshock_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: flowshield-db
    restart: always
    environment:
      POSTGRES_USER: cashshock_user
      POSTGRES_PASSWORD: cashshock_password
      POSTGRES_DB: cashshock_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashshock_user -d cashshock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

